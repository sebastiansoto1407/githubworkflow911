name : CI pruebas automatizadas en dev
on: 
    push:
        branches:
        - dev
    pull_request:
        branches:
        - dev
jobs:
    test_app:
        name: ejecutar pruebas python
        runs-on: ubuntu-latest
        steps:
            - name: checkout del codigo
              uses: actions/checkout@v5
            - name: configurar el entorno de python
              uses: actions/setup-python@v4
              with:
                    python-version: "3.13"
            - name: instalar dependencias del proyecto
              run: |
                    python -m pip install --upgrade pip
                    pip install -r requirements.txt
            - name: ejecutar las pruebas (Unit, Integration, E2E)
              run: |
                    echo "Empezando con pruebas de python"
                    python -m pytest --rootdir . -s
            - name : Reporte Final
              run: |
                    echo "Pruebas aprobadas verifique resultados"